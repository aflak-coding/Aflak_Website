name: Process new CVs

# يعمل تلقائيًا كلما رُفع ملف PDF جديد داخل مجلدات cvs/<الدولة>/
on:
  push:
    paths:
      - 'cvs/*/*.pdf'
  workflow_dispatch:

# تسلسل التشغيل: لو رُفعت دفعات متتالية تنتظر كل دفعة التي قبلها بدل التعارض
concurrency:
  group: process-cvs
  cancel-in-progress: false

permissions:
  contents: write
  actions: write

jobs:
  process:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install tools
        run: |
          sudo apt-get update
          sudo apt-get install -y poppler-utils tesseract-ocr python3-pil python3-numpy

      - name: Add new CVs (data/cvs-*.json)
        run: python scripts/process_cvs.py

      - name: Commit changes
        id: commit
        run: |
          git config user.name "aflak-bot"
          git config user.email "aflak-bot@users.noreply.github.com"
          git add -A data cvs
          if git diff --cached --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            git commit -m "Add new CVs automatically"
            for i in 1 2 3 4 5; do
              git pull --rebase -X theirs origin main && git push && break
              sleep $((i*5))
            done
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Redeploy the website
        if: steps.commit.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run jekyll-gh-pages.yml --ref main
