name: Tidy repo (one-time)

on: workflow_dispatch

permissions:
  contents: write
  actions: write

jobs:
  tidy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Move files into folders
        run: |
          mkdir -p archive/old-pages docs
          for f in assistant cook driver maid nurse bangladesh ethiopia kenya philippines srilanka uganda; do
            if [ -f "$f.html" ]; then git mv "$f.html" "archive/old-pages/$f.html"; fi
          done
          if [ -f guide-for-colleagues-ar.md ]; then
            if [ -e docs/guide-for-colleagues-ar.md ]; then git rm -q guide-for-colleagues-ar.md; else git mv guide-for-colleagues-ar.md docs/; fi
          fi
          if [ -d workflows ]; then git mv workflows archive/stray-workflows; fi
          git status --short

      - name: Commit and redeploy
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name "aflak-bot"
          git config user.email "aflak-bot@users.noreply.github.com"
          if git diff --cached --quiet; then
            echo "Nothing to move."
          else
            git commit -m "Tidy repo: move old root pages and docs into folders"
            git pull --rebase origin main && git push
            gh workflow run jekyll-gh-pages.yml --ref main
          fi
