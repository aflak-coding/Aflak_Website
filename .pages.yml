# إعدادات لوحة التحكم Pages CMS (https://app.pagescms.org)
#
# الطريقة الأساسية: ارفع ملف الـ PDF من قسم "رفع سيرة ذاتية - <الدولة>" في القائمة الجانبية.
# بعد دقيقة أو اثنتين تُضاف السيرة تلقائيًا إلى الموقع (الاسم من اسم الملف، والجنسية من القسم).
# قسم "السير الذاتية" اختياري: لتعديل بيانات سيرة (العمر، الخبرة، ...) أو تغيير صورتها.
media:
  - name: pdf_kenya
    label: "رفع سيرة ذاتية - كينيا"
    input: cvs/kenya
    output: /cvs/kenya
    extensions: [pdf]
    rename: safe
  - name: pdf_bangladesh
    label: "رفع سيرة ذاتية - بنغلاديش"
    input: cvs/bangladesh
    output: /cvs/bangladesh
    extensions: [pdf]
    rename: safe
  - name: pdf_philippines
    label: "رفع سيرة ذاتية - الفلبين"
    input: cvs/philippines
    output: /cvs/philippines
    extensions: [pdf]
    rename: safe
  - name: pdf_ethiopia
    label: "رفع سيرة ذاتية - إثيوبيا"
    input: cvs/ethiopia
    output: /cvs/ethiopia
    extensions: [pdf]
    rename: safe
  - name: pdf_srilanka
    label: "رفع سيرة ذاتية - سريلانكا"
    input: cvs/srilanka
    output: /cvs/srilanka
    extensions: [pdf]
    rename: safe
  - name: pdf_uganda
    label: "رفع سيرة ذاتية - أوغندا"
    input: cvs/uganda
    output: /cvs/uganda
    extensions: [pdf]
    rename: safe
  - name: photos
    label: "صور العاملات"
    input: cvs/photos
    output: /cvs/photos
    categories: [image]
    rename: safe

content:
  - name: cvs_kenya
    label: "السير الذاتية - كينيا (تعديل البيانات)"
    type: file
    path: data/cvs-kenya.json
    format: json
    operations:
      delete: false
    fields:
      - name: cvs
        label: "سير كينيا"
        type: object
        list:
          collapsible:
            collapsed: true
            summary: "{ref} - {name} · {status}"
        fields:
          - name: name
            label: "الاسم (بالإنجليزي)"
            type: string
            required: true
          - name: nat
            label: "الجنسية"
            type: select
            required: true
            options:
              values:
                - { name: n1, label: "كينيا" }
                - { name: n2, label: "بنغلاديش" }
                - { name: n3, label: "الفلبين" }
                - { name: n4, label: "إثيوبيا" }
                - { name: n5, label: "سريلانكا" }
                - { name: n6, label: "أوغندا" }
          - name: file
            label: "مسار ملف الـ PDF (لا تغيّره)"
            type: string
            required: true
          - name: photo
            label: "صورة العاملة (يمكن استبدالها)"
            type: image
            options:
              media: photos
          - name: job
            label: "المهنة"
            type: select
            options:
              values:
                - { name: svc1, label: "عاملة منزلية" }
                - { name: svc2, label: "سائق شخصي" }
                - { name: svc3, label: "طباخ / طباخة" }
                - { name: svc4, label: "ممرضة منزلية" }
                - { name: svc5, label: "مساعدة شخصية" }
          - name: age
            label: "العمر"
            type: number
            options:
              min: 18
              max: 60
          - name: rel
            label: "الديانة"
            type: select
            options:
              values:
                - { name: m, label: "مسلم" }
                - { name: o, label: "غير مسلم" }
          - name: st
            label: "الحالة الاجتماعية"
            type: select
            options:
              values:
                - { name: s, label: "غير متزوج" }
                - { name: m, label: "متزوج" }
          - name: exp
            label: "الخبرة"
            type: select
            options:
              values:
                - { name: new, label: "قادم جديد" }
                - { name: prev, label: "خبرة سابقة" }
          - name: ref
            label: "الرقم المرجعي"
            type: string
          - name: status
            label: "الحالة (متاحة / محجوزة / تم التعاقد)"
            type: select
            options:
              values:
                - { name: available, label: "متاحة" }
                - { name: reserved, label: "محجوزة" }
                - { name: hidden, label: "تم التعاقد (مخفية من الموقع)" }
          - name: pp
            label: "بصمة الجواز (تلقائي، لا تعدّل)"
            type: string
            hidden: true
